<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>PWmgr</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="title">PWmgr</span>
    <span id="conn" class="conn-status">連線中…</span>
  </header>
  <div id="content">
    <p class="hint" id="current-url"></p>
    <input id="launch-search" type="search" placeholder="搜尋…" hidden />
    <nav id="group-menu" hidden aria-label="依群組瀏覽">
      <ul class="group-list" id="group-list"></ul>
    </nav>
    <ul id="matches" hidden></ul>
    <p class="empty" id="empty" hidden></p>
  </div>
  <footer>
    <label class="settings">
      <input type="checkbox" id="navigate-toggle" />
      <span>啟用未命中頁面的條目快選</span>
    </label>
    <span id="status"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
