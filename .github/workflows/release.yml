name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # windows-latest runner 偶爾會在快速連續建立/銷毀多個 tk.Tk() 時,
        # 短暫鎖住 tcl/tk 的 library 檔案(疑似 Windows Defender 即時掃描),
        # 導致 _tkinter.TclError: Can't find a usable init.tcl/tk.tcl。
        # 只針對這個特定例外重跑,真正的邏輯錯誤(AssertionError 等)不會被蓋過。
        run: pytest tests/ -v --reruns 2 --reruns-delay 1 --only-rerun "_tkinter.TclError"

      - name: Build PWmgr.exe + PWmgrSetup.exe
        # packaging/build.py 印出的完成訊息含中文;CI 的 stdout 沒接真的 console,
        # Python 預設會落到系統 cp1252 codepage 編碼,印中文字會 UnicodeEncodeError。
        # 只在這個 step 設 PYTHONIOENCODING(只影響 stdout/stderr 編碼),不設
        # 整個 job 共用的 PYTHONUTF8(先前試過,結果證實與 tcl/tk 的間歇性
        # 讀檔失敗無關,是誤判——但範圍仍縮小到單一 step,不冒不必要的風險)。
        env:
          PYTHONIOENCODING: "utf-8"
        run: python packaging/build.py

      - name: Package release assets
        shell: pwsh
        run: |
          Copy-Item -Recurse chrome_extension dist/PWmgr/chrome_extension
          Compress-Archive -Path dist/PWmgr/* -DestinationPath dist/PWmgr-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PWmgr-${{ github.ref_name }}.zip
            dist/PWmgrSetup.exe
