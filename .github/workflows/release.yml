name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build PWmgr.exe + PWmgrSetup.exe
        # packaging/build.py 印出的完成訊息含中文;CI 的 stdout 沒接真的 console,
        # Python 預設會落到系統 cp1252 codepage 編碼,印中文字會 UnicodeEncodeError。
        # 只在這個 step 設 PYTHONIOENCODING(只影響 stdout/stderr 編碼),
        # 不要設整個 job 共用的 PYTHONUTF8——那個連檔案系統編碼一起改,
        # 會害 tkinter 在 Windows 上找不到 init.tcl。
        env:
          PYTHONIOENCODING: "utf-8"
        run: python packaging/build.py

      - name: Package release assets
        shell: pwsh
        run: |
          Copy-Item -Recurse chrome_extension dist/PWmgr/chrome_extension
          Compress-Archive -Path dist/PWmgr/* -DestinationPath dist/PWmgr-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PWmgr-${{ github.ref_name }}.zip
            dist/PWmgrSetup.exe
