name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 專案依賴 Windows API(ctypes.WinDLL 熱鍵、Windows Credential Manager),
    # 只有 windows-latest 能完整跑過整個 tests/(尤其是 test_app_smoke.py)。
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # windows-latest runner 偶爾會在快速連續建立/銷毀多個 tk.Tk() 時,
        # 短暫鎖住 tcl/tk 的 library 檔案(疑似 Windows Defender 即時掃描),
        # 導致 _tkinter.TclError: Can't find a usable init.tcl/tk.tcl。
        # 只針對這個特定例外重跑,真正的邏輯錯誤(AssertionError 等)不會被蓋過。
        run: pytest tests/ -v --reruns 2 --reruns-delay 1 --only-rerun "_tkinter.TclError"
